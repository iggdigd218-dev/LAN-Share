<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <title>LAN Share</title>
  <link rel="stylesheet" href="/assets/style.css" />
</head>
<body>
  <div id="app">
    <section id="login" class="screen">
      <div class="login-card">
        <div class="logo">LAN</div>
        <h1>مشاركة الملفات</h1>
        <p class="muted">اربط هاتفك بالكمبيوتر عبر شبكة المحل المحلية. أدخل رمز PIN الظاهر على شاشة الكمبيوتر.</p>
        <form id="login-form">
          <input id="pin" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="رمز PIN" />
          <button type="submit">دخول</button>
        </form>
        <p id="login-err" class="err" hidden></p>
        <div class="hint">تأكد أن الهاتف والكمبيوتر على نفس شبكة الـ LAN / Wi‑Fi.</div>
      </div>
    </section>

    <section id="main" class="screen" hidden>
      <header class="top">
        <button id="btn-back" class="icon-btn" title="رجوع">‹</button>
        <div class="path-wrap">
          <div id="path-label" class="path">الملفات</div>
        </div>
        <button id="btn-up" class="icon-btn" title="رفع ملف">↑</button>
      </header>
      <div class="search-bar">
        <input id="search" type="search" placeholder="بحث في هذا المجلد…" />
      </div>
      <div id="crumbs" class="crumbs"></div>
      <div id="list" class="list"></div>
      <p id="empty" class="empty" hidden>لا توجد ملفات هنا</p>
    </section>
  </div>

  <div id="player" class="player" hidden>
    <button id="player-close" class="icon-btn">×</button>
    <div id="player-title" class="player-title"></div>
    <video id="vid" controls playsinline></video>
    <audio id="aud" controls></audio>
    <a id="dl-link" class="dl">تنزيل إلى الجهاز</a>
  </div>

  <input id="file-input" type="file" hidden multiple />

  <script src="/assets/app.js"></script>
</body>
</html>
