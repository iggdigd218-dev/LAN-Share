name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Sign APK
        run: |
          BUILD_TOOLS=$(find $ANDROID_SDK_ROOT/build-tools -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          keytool -genkey -v -keystore /tmp/release.jks -alias lanshare -keyalg RSA -keysize 2048 -validity 10000 -storepass lanshare123 -keypass lanshare123 -dname "CN=LANShare, O=LANShare, C=YE"
          $BUILD_TOOLS/apksigner sign --ks /tmp/release.jks --ks-pass pass:lanshare123 --out android/app/build/outputs/apk/release/LAN-Share.apk android/app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LAN-Share-Android
          path: android/app/build/outputs/apk/release/LAN-Share.apk
      - name: Attach APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.0 --title "LAN Share 1.0" --notes "تطبيق أندرويد LAN-Share.apk" || true
          gh release upload v1.0.0 android/app/build/outputs/apk/release/LAN-Share.apk --clobber
